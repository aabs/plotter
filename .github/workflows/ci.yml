name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore plotter.slnx

      - name: Build
        run: dotnet build plotter.slnx --no-restore --warnaserror

      - name: Test with coverage
        run: dotnet test plotter.slnx --no-build --settings coverage.runsettings

      - name: Enforce coverage baseline
        run: python3 eng/check_coverage.py 60

      - name: Format verification
        run: dotnet format plotter.slnx --no-restore --verify-no-changes

  build-and-publish:
    # Trusted publishing (OIDC) is only available on trusted branches, not pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Run inside the 'release' GitHub Environment so the OIDC token carries
    # environment=release, matching the nuget.org trusted publisher policy.
    environment: release
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC → short-lived API key)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore plotter.slnx

      - name: Build (Release)
        run: dotnet build plotter.slnx --no-restore --configuration Release --warnaserror

      - name: Pack
        run: dotnet pack src/Plotter.Cli/Plotter.Cli.csproj --no-build --configuration Release --output artifacts

      # NuGet trusted publishing: exchange the GitHub OIDC token for a short-lived API key.
      # Requires the repository to be registered as a trusted publisher on nuget.org and
      # the NUGET_USER secret (nuget.org profile name) to be configured in repository secrets.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json