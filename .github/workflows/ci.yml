name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore plotter.slnx

      - name: Build
        run: dotnet build plotter.slnx --no-restore --warnaserror

      - name: Test with coverage
        run: dotnet test plotter.slnx --no-build --settings coverage.runsettings

      - name: Enforce coverage baseline
        run: python3 eng/check_coverage.py 60

      - name: Format verification
        run: dotnet format plotter.slnx --no-restore --verify-no-changes

  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    steps:
    # Build your artifacts/my-sdk.nupkg package here

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: plotter-bot # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address

    # Push the package
    - name: NuGet push
      run: dotnet nuget push artifacts/my-sdk.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
